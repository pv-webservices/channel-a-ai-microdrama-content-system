name: Bootstrap npm lockfile

on:
  pull_request:
    branches: [main]

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile for repository bootstrap
        shell: bash
        run: |
          echo LOCKFILE_B64_START
          base64 -w 0 package-lock.json
          echo
          echo LOCKFILE_B64_END
