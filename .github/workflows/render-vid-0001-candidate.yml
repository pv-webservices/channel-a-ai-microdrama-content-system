name: Render VID-0001 candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'remotion/**'
      - 'scripts/generate-vid-0001-foley.py'
      - 'production/VID-0001/remotion-plan.md'
      - 'production/VID-0001/phase-e-status.md'
      - '.github/workflows/render-vid-0001-candidate.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install deterministic Foley dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0

      - name: Materialize approved media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/VID-0001/images public/assets/VID-0001/audio renders

          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5399567442/render.jpg?token=exp=1789257600~hmac=afc2ff23ff5d3d5df14f801fd4398261ff9887aadfaac7f99b443fa3f598b0d6' -o public/assets/VID-0001/images/AST-VID0001-SC01.jpg
          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5399567560/render.jpg?token=exp=1789257600~hmac=5e3fc342d963a269ad7a4cf0f0833eedda97fa135ed41080f1f994c14938ee9f' -o public/assets/VID-0001/images/AST-VID0001-SC02.jpg
          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5399572231/render.png?token=exp=1789257600~hmac=40ac21a0c1d5677a7ff838ae6abc1227a56a0ec8504e88e516ee215dba404e1d' -o public/assets/VID-0001/images/AST-VID0001-SC03.png
          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5399570279/render.jpg?token=exp=1789257600~hmac=24d9b6a01ec4ec987c601b92b3d6ebbde02a0b82f35f192491dff8c565c9d3fa' -o public/assets/VID-0001/images/AST-VID0001-SC04.jpg
          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5399573217/render.png?token=exp=1789257600~hmac=ccd186760fd22be505a3b85cb0de3e9720d66bf0414d1b246d84a9e8e2ed018b' -o public/assets/VID-0001/images/AST-VID0001-SC05.png
          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5399574419/render.png?token=exp=1789257600~hmac=9c5a262cfe25596f5d68b4e1b192dc2bc1bb0431f430e4ff12b3aa11dbdf4fce' -o public/assets/VID-0001/images/AST-VID0001-SC06.png
          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5399575902/render.png?token=exp=1789257600~hmac=5e1872d70c82a69bc51f7208ad8660c1248e4b968ddfbccdbbe1b71658097c58' -o public/assets/VID-0001/images/AST-VID0001-SC07.png

          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5400771799/audio.mp3?token=exp=1789257600~hmac=6dea394d1a4a0d15a367ff660639f00d0880c2d06c9bb199c4f808d78f85f432' -o public/assets/VID-0001/audio/AUD-01-voiceover.mp3
          curl -fL --retry 3 'https://pikaso.cdnpk.net/private/production/5400858233/a2b497ee-a672-49c4-94f0-08a67b0b8a58.mp3?token=exp=1789257600~hmac=53925bde92bcb8e6cf3cd56a2033a94b598573301d1c84e85f48330bdfb20961' -o public/assets/VID-0001/audio/AUD-07-reverie.mp3

          python scripts/generate-vid-0001-foley.py public/assets/VID-0001/audio

      - name: Validate production manifest
        run: npm run validate:manifests -- --video=VID-0001 --require-assets

      - name: Typecheck
        run: npm run typecheck

      - name: Render candidate
        run: npm run render:vid-0001

      - name: Install FFmpeg probe tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Probe candidate
        shell: bash
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json renders/VID-0001.mp4 > renders/VID-0001-ffprobe.json
          python - <<'PY'
          import json
          p=json.load(open('renders/VID-0001-ffprobe.json'))
          video=next(s for s in p['streams'] if s.get('codec_type')=='video')
          audio=next(s for s in p['streams'] if s.get('codec_type')=='audio')
          duration=float(p['format']['duration'])
          assert video['width']==1080 and video['height']==1920, video
          assert video['r_frame_rate']=='30/1', video
          assert 24.9 <= duration <= 25.1, duration
          print('Candidate probe passed:', video['codec_name'], video['width'], video['height'], video['r_frame_rate'], audio['codec_name'], duration)
          PY

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: VID-0001-stage15-candidate-1
          path: |
            renders/VID-0001.mp4
            renders/VID-0001-ffprobe.json
            remotion/data/VID-0001.json
          if-no-files-found: error
          retention-days: 30
